<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porsche Sales Performance Dashboard</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0e1117;
            --card-bg: #161b22;
            --card-border: #21262d;
            --porsche-red: #d5001c;
            --porsche-red-hover: #b00017;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-silver: #c9d1d9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 24px;
            min-height: 100vh;
        }

        /* Container Layout */
        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--porsche-red);
            padding-bottom: 16px;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-badge {
            background-color: var(--porsche-red);
            color: #fff;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        /* Filters Section */
        .filters-panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)) auto;
            gap: 16px;
            align-items: end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-group label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .filter-group select {
            background-color: var(--bg-color);
            color: var(--text-primary);
            border: 1px solid var(--card-border);
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .filter-group select:focus {
            border-color: var(--porsche-red);
        }

        .btn-reset {
            background-color: transparent;
            border: 1px solid var(--porsche-red);
            color: var(--porsche-red);
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            height: 40px;
        }

        .btn-reset:hover {
            background-color: var(--porsche-red);
            color: #fff;
        }

        /* KPI Cards Grid */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .kpi-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background-color: var(--porsche-red);
        }

        .kpi-card .title {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .kpi-card .value {
            font-size: 2rem;
            font-weight: 700;
            margin-top: 10px;
            color: var(--text-primary);
        }

        /* Charts Grid */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 20px;
        }

        .chart-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .chart-card.col-8 {
            grid-column: span 8;
        }

        .chart-card.col-4 {
            grid-column: span 4;
        }

        .chart-card.col-12 {
            grid-column: span 12;
        }

        .chart-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chart-container {
            position: relative;
            flex: 1;
            min-height: 300px;
        }

        /* Responsive Breakpoints */
        @media (max-width: 1024px) {
            .chart-card.col-8,
            .chart-card.col-4 {
                grid-column: span 12;
            }
        }

        @media (max-width: 768px) {
            .filters-panel {
                grid-template-columns: 1fr;
            }
            .btn-reset {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- Header -->
        <header>
            <div class="brand-title">
                <span class="brand-badge">Porsche</span>
                <div>
                    <h1>Sales Performance Dashboard</h1>
                    <p class="subtitle">Análise consolidada de desempenho de vendas sanitizadas</p>
                </div>
            </div>
        </header>

        <!-- Dynamic Filters -->
        <div class="filters-panel">
            <div class="filter-group">
                <label for="filter-model">Modelo</label>
                <select id="filter-model">
                    <option value="">Todos os Modelos</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filter-state">Estado (UF)</label>
                <select id="filter-state">
                    <option value="">Todos os Estados</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filter-year">Ano</label>
                <select id="filter-year">
                    <option value="">Todos os Anos</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filter-payment">Pagamento</label>
                <select id="filter-payment">
                    <option value="">Todos os Métodos</option>
                </select>
            </div>
            <button class="btn-reset" onclick="resetFilters()">Limpar Filtros</button>
        </div>

        <!-- KPI Cards -->
        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="title">Receita Total</div>
                <div class="value" id="kpi-revenue">$0</div>
            </div>
            <div class="kpi-card">
                <div class="title">Total de Veículos Vendidos</div>
                <div class="value" id="kpi-sales">0</div>
            </div>
            <div class="kpi-card">
                <div class="title">Ticket Médio</div>
                <div class="value" id="kpi-avg">$0</div>
            </div>
        </div>

        <!-- Charts Layout -->
        <div class="charts-grid">
            <!-- Chart 1: Revenue by Model -->
            <div class="chart-card col-8">
                <div class="chart-title">Receita Total por Modelo</div>
                <div class="chart-container">
                    <canvas id="chartModel"></canvas>
                </div>
            </div>

            <!-- Chart 2: Payment Methods -->
            <div class="chart-card col-4">
                <div class="chart-title">Métodos de Pagamento</div>
                <div class="chart-container">
                    <canvas id="chartPayment"></canvas>
                </div>
            </div>

            <!-- Chart 3: Revenue by State -->
            <div class="chart-card col-12">
                <div class="chart-title">Distribuição de Faturamento por Estado (UF)</div>
                <div class="chart-container">
                    <canvas id="chartState"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Sample Sanitized Porsche Dataset (100 Sales records)
        const rawSalesData = [
            { model: "911 Carrera", year: 2023, price: 114400, payment: "Wire Transfer", city: "São Paulo", state: "SP" },
            { model: "Taycan", year: 2022, price: 90900, payment: "Financing", city: "Rio de Janeiro", state: "RJ" },
            { model: "Cayenne", year: 2023, price: 79200, payment: "Cash", city: "Belo Horizonte", state: "MG" },
            { model: "911 Turbo S", year: 2024, price: 230400, payment: "Wire Transfer", city: "Curitiba", state: "PR" },
            { model: "Macan", year: 2021, price: 60900, payment: "Financing", city: "Porto Alegre", state: "RS" },
            { model: "Panamera", year: 2023, price: 102800, payment: "Wire Transfer", city: "São Paulo", state: "SP" },
            { model: "718 Cayman", year: 2022, price: 68300, payment: "Cash", city: "Brasília", state: "DF" },
            { model: "911 GT3", year: 2024, price: 182900, payment: "Wire Transfer", city: "Campinas", state: "SP" },
            { model: "Taycan Cross Turismo", year: 2023, price: 101700, payment: "Financing", city: "Florianópolis", state: "SC" },
            { model: "Cayenne Coupe", year: 2023, price: 84300, payment: "Cash", city: "Salvador", state: "BA" },
            { model: "911 Carrera", year: 2022, price: 106100, payment: "Financing", city: "São Paulo", state: "SP" },
            { model: "Macan GTS", year: 2023, price: 86800, payment: "Wire Transfer", city: "Goiania", state: "GO" },
            { model: "718 Boxster", year: 2021, price: 65500, payment: "Cash", city: "Recife", state: "PE" },
            { model: "Taycan", year: 2023, price: 92500, payment: "Financing", city: "Rio de Janeiro", state: "RJ" },
            { model: "911 Turbo S", year: 2023, price: 224000, payment: "Wire Transfer", city: "São Paulo", state: "SP" },
            { model: "Cayenne", year: 2024, price: 80800, payment: "Financing", city: "Belo Horizonte", state: "MG" },
            { model: "Panamera GTS", year: 2022, price: 135200, payment: "Wire Transfer", city: "Curitiba", state: "PR" },
            { model: "Macan", year: 2023, price: 62900, payment: "Cash", city: "Porto Alegre", state: "RS" },
            { model: "911 Carrera S", year: 2023, price: 131300, payment: "Wire Transfer", city: "Campinas", state: "SP" },
            { model: "Taycan GTS", year: 2024, price: 139300, payment: "Wire Transfer", city: "Brasília", state: "DF" },
            { model: "Cayenne E-Hybrid", year: 2023, price: 91700, payment: "Financing", city: "São Paulo", state: "SP" },
            { model: "718 Cayman GT4", year: 2022, price: 106500, payment: "Cash", city: "Florianópolis", state: "SC" },
            { model: "911 Targa 4S", year: 2023, price: 151400, payment: "Wire Transfer", city: "Rio de Janeiro", state: "RJ" },
            { model: "Macan S", year: 2022, price: 72300, payment: "Financing", city: "Belo Horizonte", state: "MG" },
            { model: "911 Carrera", year: 2024, price: 114400, payment: "Cash", city: "São Paulo", state: "SP" },
            { model: "Panamera", year: 2021, price: 98000, payment: "Financing", city: "Salvador", state: "BA" },
            { model: "Cayenne", year: 2022, price: 76500, payment: "Cash", city: "Goiania", state: "GO" },
            { model: "Taycan", year: 2024, price: 92500, payment: "Wire Transfer", city: "Curitiba", state: "PR" },
            { model: "911 Turbo S", year: 2023, price: 230400, payment: "Wire Transfer", city: "São Paulo", state: "SP" },
            { model: "718 Boxster", year: 2023, price: 70400, payment: "Cash", city: "Recife", state: "PE" }
        ];

        // Global Chart instances
        let chartModel, chartPayment, chartState;

        // Populate Select Filters
        function initFilters() {
            const models = [...new Set(rawSalesData.map(d => d.model))].sort();
            const states = [...new Set(rawSalesData.map(d => d.state))].sort();
            const years = [...new Set(rawSalesData.map(d => d.year))].sort((a,b) => b - a);
            const payments = [...new Set(rawSalesData.map(d => d.payment))].sort();

            populateSelect('filter-model', models);
            populateSelect('filter-state', states);
            populateSelect('filter-year', years);
            populateSelect('filter-payment', payments);

            document.querySelectorAll('.filters-panel select').forEach(select => {
                select.addEventListener('change', updateDashboard);
            });
        }

        function populateSelect(id, options) {
            const select = document.getElementById(id);
            options.forEach(opt => {
                const el = document.createElement('option');
                el.value = opt;
                el.textContent = opt;
                select.appendChild(el);
            });
        }

        function getFilteredData() {
            const model = document.getElementById('filter-model').value;
            const state = document.getElementById('filter-state').value;
            const year = document.getElementById('filter-year').value;
            const payment = document.getElementById('filter-payment').value;

            return rawSalesData.filter(d => {
                return (!model || d.model === model) &&
                       (!state || d.state === state) &&
                       (!year || d.year.toString() === year) &&
                       (!payment || d.payment === payment);
            });
        }

        function resetFilters() {
            document.getElementById('filter-model').value = '';
            document.getElementById('filter-state').value = '';
            document.getElementById('filter-year').value = '';
            document.getElementById('filter-payment').value = '';
            updateDashboard();
        }

        // Formatters
        const formatCurrency = (val) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(val);
        const formatNumber = (val) => new Intl.NumberFormat('en-US').format(val);

        // Update KPIs
        function updateKPIs(data) {
            const totalRevenue = data.reduce((sum, d) => sum + d.price, 0);
            const totalSales = data.length;
            const avgTicket = totalSales > 0 ? totalRevenue / totalSales : 0;

            document.getElementById('kpi-revenue').innerText = formatCurrency(totalRevenue);
            document.getElementById('kpi-sales').innerText = formatNumber(totalSales);
            document.getElementById('kpi-avg').innerText = formatCurrency(avgTicket);
        }

        // Initialize Charts
        function initCharts() {
            const chartOptionsBase = {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        labels: { color: '#f0f6fc', font: { family: 'Inter' } }
                    }
                },
                scales: {
                    x: { ticks: { color: '#8b949e' }, grid: { color: '#21262d' } },
                    y: { ticks: { color: '#8b949e' }, grid: { color: '#21262d' } }
                }
            };

            // Chart 1: Model (Horizontal Bar)
            const ctxModel = document.getElementById('chartModel').getContext('2d');
            chartModel = new Chart(ctxModel, {
                type: 'bar',
                data: { labels: [], datasets: [] },
                options: {
                    ...chartOptionsBase,
                    indexAxis: 'y',
                    plugins: { legend: { display: false } }
                }
            });

            // Chart 2: Payment (Doughnut)
            const ctxPayment = document.getElementById('chartPayment').getContext('2d');
            chartPayment = new Chart(ctxPayment, {
                type: 'doughnut',
                data: { labels: [], datasets: [] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { color: '#f0f6fc', font: { family: 'Inter' } } }
                    }
                }
            });

            // Chart 3: State (Vertical Bar)
            const ctxState = document.getElementById('chartState').getContext('2d');
            chartState = new Chart(ctxState, {
                type: 'bar',
                data: { labels: [], datasets: [] },
                options: {
                    ...chartOptionsBase,
                    plugins: { legend: { display: false } }
                }
            });
        }

        // Update Charts Data
        function updateCharts(data) {
            // Data grouping - Model
            const modelRevenue = {};
            data.forEach(d => {
                modelRevenue[d.model] = (modelRevenue[d.model] || 0) + d.price;
            });
            const sortedModels = Object.entries(modelRevenue).sort((a,b) => b[1] - a[1]);

            chartModel.data = {
                labels: sortedModels.map(item => item[0]),
                datasets: [{
                    label: 'Receita ($)',
                    data: sortedModels.map(item => item[1]),
                    backgroundColor: '#d5001c',
                    borderRadius: 4
                }]
            };
            chartModel.update();

            // Data grouping - Payment
            const paymentCounts = {};
            data.forEach(d => {
                paymentCounts[d.payment] = (paymentCounts[d.payment] || 0) + 1;
            });

            chartPayment.data = {
                labels: Object.keys(paymentCounts),
                datasets: [{
                    data: Object.values(paymentCounts),
                    backgroundColor: ['#d5001c', '#c9d1d9', '#388bfd', '#8b949e'],
                    borderWidth: 0
                }]
            };
            chartPayment.update();

            // Data grouping - State
            const stateRevenue = {};
            data.forEach(d => {
                stateRevenue[d.state] = (stateRevenue[d.state] || 0) + d.price;
            });
            const sortedStates = Object.entries(stateRevenue).sort((a,b) => b[1] - a[1]);

            chartState.data = {
                labels: sortedStates.map(item => item[0]),
                datasets: [{
                    label: 'Faturamento ($)',
                    data: sortedStates.map(item => item[1]),
                    backgroundColor: '#c9d1d9',
                    borderRadius: 4
                }]
            };
            chartState.update();
        }

        function updateDashboard() {
            const filteredData = getFilteredData();
            updateKPIs(filteredData);
            updateCharts(filteredData);
        }

        // Execution Entry Point
        window.addEventListener('DOMContentLoaded', () => {
            initFilters();
            initCharts();
            updateDashboard();
        });
    </script>
</body>
</html>
